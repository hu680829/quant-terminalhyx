name: Quant terminal daily report
on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1-5"
    - cron: "0 13 * * 1-5"
permissions:
  contents: read
jobs:
  run-quant-terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile fetch_data.py
      - name: Run scanner and report
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python fetch_data.py
