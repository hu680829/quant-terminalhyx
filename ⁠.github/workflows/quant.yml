name: 7大师量化选股与推送

on:
  schedule:
    - cron: '30 6 * * 1-5'
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

jobs:
  run-stock-picker:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行量化选股脚本
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python fetch_data.py
